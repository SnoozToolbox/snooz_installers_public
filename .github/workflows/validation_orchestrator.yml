name: Validate all platforms

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      installer_repo:
        description: Installer release repository (owner/name)
        required: true
        default: SnoozToolbox/snooz-toolbox-ceams
      installer_tag_windows:
        description: Windows installer release tag to validate
        required: true
        default: v1.0.1-rc3
      installer_tag_linux:
        description: Linux installer release tag to validate
        required: true
        default: v1.0.1-rc3
      installer_tag_macos_x64:
        description: macOS x64 installer release tag to validate (leave empty to auto-derive)
        required: true
        default: "v1.0.1-rc3"
      installer_tag_macos_arm64:
        description: macOS arm64 installer release tag to validate (leave empty to auto-derive)
        required: true
        default: "v1.0.1-rc3"
      package_version:
        description: "CEAMS package version to validate (ex: 7.4.0)"
        required: true
        default: "7.4.0"
      dataset_repo:
        description: Private dataset repository (owner/name)
        required: true
        default: SnoozToolbox/snooz-datasets-private
      dataset_tag:
        description: Dataset release tag
        required: true
        default: v1.0.0
      tools_to_process:
        description: "Comma-separated list of tool basenames to adapt in this run. Leave empty to run all tools."
        required: false
        default: ""
      gold_standard_repo:
        description: Gold-standard repository (owner/name)
        required: false
        default: SnoozToolbox/snooz-gold-standards
      gold_standard_tag:
        description: Gold-standard release tag (optional; enables output comparison)
        required: false
        default: v1.0.0

jobs:
  validate_windows:
    uses: ./.github/workflows/validation_windows.yml
    with:
      installer_repo: ${{ inputs.installer_repo }}
      installer_tag: ${{ inputs.installer_tag_windows }}
      installer_asset_pattern: "Snooz*.exe"
      package_version: ${{ inputs.package_version }}
      dataset_repo: ${{ inputs.dataset_repo }}
      dataset_tag: ${{ inputs.dataset_tag }}
      tools_to_process: ${{ inputs.tools_to_process }}
      gold_standard_repo: ${{ inputs.gold_standard_repo }}
      gold_standard_tag: ${{ inputs.gold_standard_tag }}
    secrets: inherit

  validate_macos_x64:
    uses: ./.github/workflows/validation_macos.yml
    with:
      arch: x64
      installer_repo: ${{ inputs.installer_repo }}
      installer_tag: ${{ inputs.installer_tag_macos_x64 }}
      installer_asset_pattern: "Snooz*-x64.dmg"
      package_version: ${{ inputs.package_version }}
      dataset_repo: ${{ inputs.dataset_repo }}
      dataset_tag: ${{ inputs.dataset_tag }}
      tools_to_process: ${{ inputs.tools_to_process }}
      gold_standard_repo: ${{ inputs.gold_standard_repo }}
      gold_standard_tag: ${{ inputs.gold_standard_tag }}
    secrets: inherit

  validate_macos_arm64:
    uses: ./.github/workflows/validation_macos.yml
    with:
      arch: arm64
      installer_repo: ${{ inputs.installer_repo }}
      installer_tag: ${{ inputs.installer_tag_macos_arm64 }}
      installer_asset_pattern: "Snooz*-arm64.dmg"
      package_version: ${{ inputs.package_version }}
      dataset_repo: ${{ inputs.dataset_repo }}
      dataset_tag: ${{ inputs.dataset_tag }}
      tools_to_process: ${{ inputs.tools_to_process }}
      gold_standard_repo: ${{ inputs.gold_standard_repo }}
      gold_standard_tag: ${{ inputs.gold_standard_tag }}
    secrets: inherit

  validate_linux:
    uses: ./.github/workflows/validation_linux.yml
    with:
      installer_repo: ${{ inputs.installer_repo }}
      installer_tag: ${{ inputs.installer_tag_linux }}
      installer_asset_pattern: "Snooz*.deb"
      installer_type: "deb"
      package_version: ${{ inputs.package_version }}
      dataset_repo: ${{ inputs.dataset_repo }}
      dataset_tag: ${{ inputs.dataset_tag }}
      tools_to_process: ${{ inputs.tools_to_process }}
      gold_standard_repo: ${{ inputs.gold_standard_repo }}
      gold_standard_tag: ${{ inputs.gold_standard_tag }}
    secrets: inherit

  consolidate_results:
    needs: [validate_windows, validate_macos_x64, validate_macos_arm64, validate_linux]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download validation artifacts from all platforms
        uses: actions/download-artifact@v4
        with:
          path: all-platform-artifacts

      - name: Merge tool-run-summary.tsv from all platforms
        shell: bash
        run: |
          mkdir -p consolidated-results
          consolidated_summary="consolidated-results/tool-run-summary-all-platforms.tsv"

          # Desired header: Tool, Version, Scenario, Run Status Windows, Comparison Status Windows,
          # Run Status macOS-x64, Comparison Status macOS-x64, Run Status macOS-arm64, Comparison Status macOS-arm64,
          # Run Status Linux, Comparison Status Linux, Validated Files
          echo -e "Tool\tVersion\tScenario\tRun Status Windows\tComparison Status Windows\tRun Status macOS-x64\tComparison Status macOS-x64\tRun Status macOS-arm64\tComparison Status macOS-arm64\tRun Status Linux\tComparison Status Linux\tValidated Files" > "$consolidated_summary"

          # Temporary map file: key = Tool||Scenario, value = tab-separated fields
          tmp_map="/tmp/validation_map.tsv"
          : > "$tmp_map"

          add_platform_rows() {
            local os_label="$1"
            local artifact_dir="$2"
            local run_col_name="run_status"
            local comp_col_name="comparison_status"

            if [ ! -d "$artifact_dir" ]; then
              echo "Warning: Artifact directory not found: $artifact_dir"
              return
            fi
            local summary_file
            summary_file=$(find "$artifact_dir" -name "tool-run-summary.tsv" -type f | head -1)
            if [ -z "$summary_file" ]; then
              echo "Warning: No tool-run-summary.tsv found in $artifact_dir"
              return
            fi

            # Read header to find column positions
            IFS=$'\t' read -r -a hdr < <(head -n1 "$summary_file")
            declare -A pos
            for i in "${!hdr[@]}"; do pos["${hdr[$i]}"]=$((i+1)); done

            tail -n +2 "$summary_file" | while IFS= read -r line || [ -n "$line" ]; do
              # Extract fields with fallbacks
              getp() { local name="$1"; local p=${pos["$name"]}; if [ -n "$p" ]; then echo "$line" | awk -F"\t" -v c=$p '{print $c}'; else echo ""; fi }
              tool=$(getp "tool_name"); if [ -z "$tool" ]; then tool=$(getp "Tool"); fi
              version=$(getp "tool_version")
              scenario=$(getp "json_name")
              runstat=$(getp "$run_col_name"); if [ -z "$runstat" ]; then runstat=$(getp "status"); fi
              compstat=$(getp "$comp_col_name")
              vfiles=$(getp "validated_files")

              key="$tool||$scenario"
              # Read existing line for key
              existing=$(grep -F "$key" "$tmp_map" || true)
              if [ -z "$existing" ]; then
                # Initialize all platform columns empty
                case "$os_label" in
                  "Windows") printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$tool" "$version" "$scenario" "$runstat" "$compstat" "" "" "" "" "" "" "$vfiles" >> "$tmp_map" ;;
                  "macOS-x64") printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$tool" "$version" "$scenario" "" "" "$runstat" "$compstat" "" "" "" "" "$vfiles" >> "$tmp_map" ;;
                  "macOS-arm64") printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$tool" "$version" "$scenario" "" "" "" "" "$runstat" "$compstat" "" "" "$vfiles" >> "$tmp_map" ;;
                  "Linux") printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$tool" "$version" "$scenario" "" "" "" "" "" "" "$runstat" "$compstat" "$vfiles" >> "$tmp_map" ;;
                esac
              else
                # Update existing line by filling proper columns
                # Build awk script to update fields
                # Fields indices: 1 Tool,2 Version,3 Scenario,4 RunW,5 CompW,6 RunM_x64,7 CompM_x64,8 RunM_arm64,9 CompM_arm64,10 RunL,11 CompL,12 ValidatedFiles
                awk -v key="$key" -v os="$os_label" -v run="$runstat" -v comp="$compstat" -v vfiles="$vfiles" -F"\t" -v OFS="\t" '
                  BEGIN{ }
                  $1"||"$3==key{
                    if(os=="Windows"){ $4=run; $5=comp }
                    else if(os=="macOS-x64"){ $6=run; $7=comp }
                    else if(os=="macOS-arm64"){ $8=run; $9=comp }
                    else if(os=="Linux"){ $10=run; $11=comp }
                    if(length(vfiles)>0) $12=vfiles
                    print; next
                  }
                  { print }
                ' "$tmp_map" > "$tmp_map.tmp" && mv "$tmp_map.tmp" "$tmp_map"
              fi
            done
          }

          # Populate map from each platform
          add_platform_rows "Windows" "all-platform-artifacts/windows-validation-assets"
          add_platform_rows "macOS-x64" "all-platform-artifacts/macos-x64-validation-assets"
          add_platform_rows "macOS-arm64" "all-platform-artifacts/macos-arm64-validation-assets"
          add_platform_rows "Linux" "all-platform-artifacts/linux-validation-assets"

          # Now output consolidated header already written, then append map contents
          # Ensure tmp_map lines have 12 columns; normalize missing fields
          while IFS= read -r line || [ -n "$line" ]; do
            # Count fields
            nf=$(awk -F"\t" '{print NF}' <<< "$line")
            if [ "$nf" -lt 12 ]; then
              # pad with empty fields
              pad=$((12-nf))
              for i in $(seq 1 $pad); do line="$line\t"; done
            fi
            echo -e "$line" >> "$consolidated_summary"
          done < "$tmp_map"

          echo "Consolidated tool-run-summary.tsv:"
          cat "$consolidated_summary"

      - name: Upload consolidated summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-summary-consolidated
          if-no-files-found: warn
          path: consolidated-results/tool-run-summary-all-platforms.tsv

      - name: Report platform validation summary
        run: |
          echo "✓ Windows validation: ${{ needs.validate_windows.result }}"
          echo "✓ macOS x64 validation: ${{ needs.validate_macos_x64.result }}"
          echo "✓ macOS arm64 validation: ${{ needs.validate_macos_arm64.result }}"
          echo "✓ Linux validation: ${{ needs.validate_linux.result }}"
          if [ "${{ needs.validate_windows.result }}" != "success" ] || \
             [ "${{ needs.validate_macos_x64.result }}" != "success" ] || \
             [ "${{ needs.validate_macos_arm64.result }}" != "success" ] || \
             [ "${{ needs.validate_linux.result }}" != "success" ]; then
            exit 1
          fi
