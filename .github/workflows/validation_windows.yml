name: Validate installer (Windows)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      installer_repo:
        description: Installer release repository (owner/name)
        required: true
        default: SnoozToolbox/snooz-toolbox-ceams
      installer_tag:
        description: Installer release tag to validate
        required: true
        default: v1.0.1-rc2-Windows
      installer_asset_pattern:
        description: Installer asset name pattern
        required: true
        default: "Snooz*.exe"
      package_version:
        description: "CEAMS package version to validate (ex: 7.4.0)"
        required: true
        default: "7.4.0"
      dataset_repo:
        description: Private dataset repository (owner/name)
        required: true
        default: SnoozToolbox/snooz-datasets-private
      dataset_tag:
        description: Dataset release tag
        required: true
        default: v1.0.0
      tools_to_process:
        description: "Comma-separated list of tool basenames to adapt in this run (example: AnalyzeEEGConnectivity,MyOtherTool). Leave empty to run all tools defined in ci/validation_tools/tool_json_adaptations.json"
        required: false
        default: ""
      gold_standard_repo:
        description: Gold-standard repository (owner/name)
        required: false
        default: SnoozToolbox/snooz-gold-standards
      gold_standard_tag:
        description: Gold-standard release tag (optional; enables output comparison)
        required: false
        default: v1.0.0

  workflow_call:
    inputs:
      installer_repo:
        description: Installer release repository (owner/name)
        required: true
        type: string
      installer_tag:
        description: Installer release tag to validate
        required: true
        type: string
      installer_asset_pattern:
        description: Installer asset name pattern
        required: true
        type: string
      package_version:
        description: "CEAMS package version to validate (ex: 7.4.0)"
        required: true
        type: string
      dataset_repo:
        description: Private dataset repository (owner/name)
        required: true
        type: string
      dataset_tag:
        description: Dataset release tag
        required: true
        type: string
      tools_to_process:
        description: "Comma-separated list of tool basenames to adapt in this run. Leave empty to run all tools."
        required: false
        type: string
        default: ""
      gold_standard_repo:
        description: Gold-standard repository (owner/name)
        required: false
        type: string
        default: SnoozToolbox/snooz-gold-standards
      gold_standard_tag:
        description: Gold-standard release tag (optional; enables output comparison)
        required: false
        type: string
        default: v1.0.0

jobs:
  validate_windows:
    runs-on: windows-2022

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Download dataset release assets (private)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_VALIDATION }}
        run: |
          if ([string]::IsNullOrWhiteSpace("${env:GH_TOKEN}")) {
            throw "Missing secret GH_PAT_VALIDATION"
          }
          New-Item -ItemType Directory -Force -Path private-dataset | Out-Null
          $tag = "${{ inputs.dataset_tag }}".Trim().Trim('"')
          $repo = "${{ inputs.dataset_repo }}".Trim().Trim('"')
          $ghArgs = @(
            "release", "download", $tag,
            "--repo", $repo,
            "--dir", "private-dataset"
          )
          & gh @ghArgs

      - name: Download gold standards release assets (optional)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_VALIDATION }}
        run: |
          $toolsToProcessInput = "${{ inputs.tools_to_process }}".Trim().Trim('"')
          $toolsToProcess = @()
          if (-not [string]::IsNullOrWhiteSpace($toolsToProcessInput)) {
            $toolsToProcess = $toolsToProcessInput -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          }

          if ($toolsToProcess.Count -eq 0) {
            $toolTransformationsPath = Join-Path (Resolve-Path ".").Path "ci/validation_tools/tool_json_adaptations.json"
            if (-not (Test-Path $toolTransformationsPath)) {
              throw "Tool adaptations config not found: $toolTransformationsPath"
            }

            $toolTransformations = Get-Content -Path $toolTransformationsPath -Raw | ConvertFrom-Json -AsHashtable
            $toolsToProcess = @(
              $toolTransformations.GetEnumerator() |
                Where-Object {
                  $_.Value -is [hashtable] -and
                  $_.Value.ContainsKey("updates") -and
                  $null -ne $_.Value.updates -and
                  $_.Value.updates.Count -gt 0
                } |
                ForEach-Object { [string]$_.Key } |
                Sort-Object
            )

            if ($toolsToProcess.Count -eq 0) {
              throw "No tool definitions with updates found in tool_json_adaptations.json"
            }

            Write-Host "No tools_to_process provided; defaulting to all tools from tool_json_adaptations.json: $($toolsToProcess -join ', ')"
          }

          $tag = "${{ inputs.gold_standard_tag }}".Trim().Trim('"')
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Host "No gold_standard_tag provided; output comparison will be skipped."
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace("${env:GH_TOKEN}")) {
            throw "Missing secret GH_PAT_VALIDATION"
          }

          $repo = "${{ inputs.gold_standard_repo }}".Trim().Trim('"')
          $goldDir = "gold-standards"
          if (Test-Path $goldDir) {
            Remove-Item -Path $goldDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $goldDir | Out-Null

          Write-Host "Downloading gold standards from $repo@$tag"
          $ghArgs = @(
            "release", "download", $tag,
            "--repo", $repo,
            "--dir", $goldDir
          )
          & gh @ghArgs

          Write-Host "Gold-standard files downloaded:"
          Get-ChildItem -Path $goldDir -Recurse -File | Select-Object -ExpandProperty FullName

      - name: Extract gold standards assets for requested tools (optional)
        shell: pwsh
        run: |
          $goldTag = "${{ inputs.gold_standard_tag }}".Trim().Trim('"')
          if ([string]::IsNullOrWhiteSpace($goldTag)) {
            Write-Host "No gold_standard_tag provided; skipping gold standards extraction."
            exit 0
          }

          $toolsToProcessInput = "${{ inputs.tools_to_process }}".Trim().Trim('"')
          $toolsToProcess = @()
          if (-not [string]::IsNullOrWhiteSpace($toolsToProcessInput)) {
            $toolsToProcess = $toolsToProcessInput -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          }

          if ($toolsToProcess.Count -eq 0) {
            $toolTransformationsPath = Join-Path (Resolve-Path ".").Path "ci/validation_tools/tool_json_adaptations.json"
            if (-not (Test-Path $toolTransformationsPath)) {
              throw "Tool adaptations config not found: $toolTransformationsPath"
            }

            $toolTransformations = Get-Content -Path $toolTransformationsPath -Raw | ConvertFrom-Json -AsHashtable
            $toolsToProcess = @(
              $toolTransformations.GetEnumerator() |
                Where-Object {
                  $_.Value -is [hashtable] -and
                  $_.Value.ContainsKey("updates") -and
                  $null -ne $_.Value.updates -and
                  $_.Value.updates.Count -gt 0
                } |
                ForEach-Object { [string]$_.Key } |
                Sort-Object
            )

            if ($toolsToProcess.Count -eq 0) {
              throw "No tool definitions with updates found in tool_json_adaptations.json"
            }

            Write-Host "No tools_to_process provided; defaulting to all tools from tool_json_adaptations.json: $($toolsToProcess -join ', ')"
          }

          $goldDir = "gold-standards"
          if (-not (Test-Path $goldDir)) {
            throw "Gold standards directory not found: $goldDir"
          }

          $zipFiles = Get-ChildItem -Path $goldDir -File -Filter "*.zip" -ErrorAction SilentlyContinue
          if ($zipFiles.Count -eq 0) {
            Write-Host "No zip asset found in gold standards. Direct files (if any) will be used as-is."
            exit 0
          }

          $extractRoot = Join-Path $goldDir "extracted"
          if (Test-Path $extractRoot) {
            Remove-Item -Path $extractRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null

          foreach ($toolName in $toolsToProcess) {
            $toolZipCandidates = $zipFiles | Where-Object {
              $_.BaseName -ieq $toolName -or $_.Name -imatch [regex]::Escape($toolName)
            }

            if ($toolZipCandidates.Count -eq 0) {
              Write-Host "No gold-standard zip matched tool '$toolName'."
              continue
            }

            $toolExtractDir = Join-Path $extractRoot $toolName
            New-Item -ItemType Directory -Path $toolExtractDir -Force | Out-Null

            foreach ($zipFile in $toolZipCandidates) {
              Write-Host "Extracting $($zipFile.Name) for tool $toolName"
              Expand-Archive -Path $zipFile.FullName -DestinationPath $toolExtractDir -Force
            }
          }

          Write-Host "Gold-standard extracted files:"
          Get-ChildItem -Path $goldDir -Recurse -File | Select-Object -ExpandProperty FullName

      - name: Extract private dataset archives and list folders
        shell: pwsh
        run: |
          $datasetRoot = (Resolve-Path "private-dataset").Path
          $zipFiles = Get-ChildItem -Path $datasetRoot -Recurse -File -Filter "*.zip" -ErrorAction SilentlyContinue

          if ($zipFiles.Count -eq 0) {
            Write-Host "No zip archive found under private-dataset."
          } else {
            foreach ($zipFile in $zipFiles) {
              $destinationDir = Split-Path -Path $zipFile.FullName -Parent
              Write-Host "Extracting archive: $($zipFile.FullName)"
              Expand-Archive -Path $zipFile.FullName -DestinationPath $destinationDir -Force
            }
          }

          Write-Host "Folders under private-dataset after extraction:"
          Get-ChildItem -Path $datasetRoot -Recurse -Directory |
            Sort-Object FullName |
            Select-Object -ExpandProperty FullName |
            ForEach-Object { $_ -replace '\\', '/' }

      - name: Download Windows installer release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace("${env:GH_TOKEN}")) {
            throw "Missing secret GH_PAT"
          }
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $tag = "${{ inputs.installer_tag }}".Trim().Trim('"')
          $repo = "${{ inputs.installer_repo }}".Trim().Trim('"')
          $pattern = "${{ inputs.installer_asset_pattern }}".Trim().Trim('"')
          $ghArgs = @(
            "release", "download", $tag,
            "--repo", $repo,
            "--pattern", $pattern,
            "--dir", "installer"
          )
          & gh @ghArgs

      - name: Show downloaded files
        shell: pwsh
        run: |
          Write-Host "Private dataset release files:"
          Get-ChildItem -Path private-dataset -Recurse -File | Select-Object -ExpandProperty FullName
          Write-Host "Installer files:"
          Get-ChildItem -Path installer -Recurse -File | Select-Object -ExpandProperty FullName

      - name: Install Snooz and extract JSON files
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path installer -Filter "*.exe" -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "No installer executable found under installer directory"
          }

          $installDir = "C:\snooz_ci_install"
          if (Test-Path $installDir) {
            Remove-Item -Path $installDir -Recurse -Force
          }

          $installerArgs = @('/S', "/D=$installDir")
          Write-Host "Installing: $($installer.FullName) $($installerArgs -join ' ')"
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList $installerArgs -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "Silent installer failed with status $($installProcess.ExitCode)"
          }

          $installedAppDir = Join-Path $installDir "Snooz Toolbox"
          if (-not (Test-Path (Join-Path $installedAppDir "_internal"))) {
            $installedAppDir = $installDir
          }

          $installedExe = Join-Path $installedAppDir "Snooz Toolbox.exe"
          if (-not (Test-Path $installedExe)) {
            $installedExe = Get-ChildItem -Path $installedAppDir -Filter "*.exe" -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch 'unins|uninstall' } |
              Sort-Object FullName |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $installedExe -or -not (Test-Path $installedExe)) {
            Write-Host "Executable candidates under install dir:"
            Get-ChildItem -Path $installDir -Filter "*.exe" -Recurse -File |
              Sort-Object FullName |
              Select-Object -ExpandProperty FullName
            throw "Expected installed executable not found under '$installedAppDir'"
          }

          Write-Host "Detected installed executable: $installedExe"
          "SNOOZ_INSTALLED_EXE=$installedExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Debug helper for future Windows/Linux/macOS workflows:
          # Write-Host "Installed package roots under LOCALAPPDATA:"
          # if (Test-Path $env:LOCALAPPDATA) {
          #   Get-ChildItem -Path $env:LOCALAPPDATA -Force | Select-Object Name,FullName,Mode | Format-Table -AutoSize | Out-String | Write-Host
          # }
          # Write-Host "Installed package roots under APPDATA:"
          # if (Test-Path $env:APPDATA) {
          #   Get-ChildItem -Path $env:APPDATA -Force | Select-Object Name,FullName,Mode | Format-Table -AutoSize | Out-String | Write-Host
          # }

          $versionUnderscore = "${{ inputs.package_version }}".Replace('.', '_')
          $ceamsToolsDir = $null
          $searchRoots = @(
            (Join-Path $env:LOCALAPPDATA "Snooz Toolbox"),
            (Join-Path $env:LOCALAPPDATA "Snooz Toolbox\\packages"),
            (Join-Path $env:APPDATA "Snooz Toolbox"),
            (Join-Path $env:LOCALAPPDATA "Snooz"),
            "C:\\snooz_ci_install"
          )

          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) {
              continue
            }

            $candidate = Get-ChildItem -Path $root -Recurse -Directory -Filter "CEAMSTools_$versionUnderscore" -ErrorAction SilentlyContinue |
              Sort-Object FullName |
              Select-Object -First 1

            if ($null -ne $candidate) {
              $ceamsToolsDir = $candidate.FullName
              break
            }
          }

          if (-not $ceamsToolsDir) {
            Write-Host "Searched roots:"
            foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                Write-Host " - $root"
              }
            }
            throw "Expected CEAMSTools directory not found for version $versionUnderscore"
          }

          $jsonOutputDir = "validation-json"
          if (Test-Path $jsonOutputDir) {
            Remove-Item -Path $jsonOutputDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $jsonOutputDir -Force | Out-Null

          $jsonFiles = Get-ChildItem -Path $ceamsToolsDir -Recurse -File -Filter "*.json"
          if ($jsonFiles.Count -eq 0) {
            throw "No JSON files found under $ceamsToolsDir"
          }

          foreach ($file in $jsonFiles) {
            $relativePath = $file.FullName.Substring($ceamsToolsDir.Length).TrimStart('\')
            $targetPath = Join-Path $jsonOutputDir $relativePath
            $targetDir = Split-Path $targetPath -Parent
            New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
            Copy-Item -Path $file.FullName -Destination $targetPath -Force
          }

          Write-Host "Extracted JSON files from installed package: $($jsonFiles.Count)"
          Write-Host "JSON files found (relative to CEAMSTools package):"
          $jsonFiles |
            ForEach-Object { $_.FullName.Substring($ceamsToolsDir.Length).TrimStart('\') } |
            Sort-Object |
            ForEach-Object { Write-Host " - $_" }

      - name: Adapt extracted JSON files for validation workspaces
        shell: pwsh
        run: |
          $sourceDir = "validation-json"
          $workspaceDir = "validation-workspaces"
          if (Test-Path $workspaceDir) {
            Remove-Item -Path $workspaceDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $workspaceDir -Force | Out-Null

          $toolsToProcessInput = "${{ inputs.tools_to_process }}".Trim().Trim('"')
          $toolsToProcess = @()
          if (-not [string]::IsNullOrWhiteSpace($toolsToProcessInput)) {
            $toolsToProcess = $toolsToProcessInput -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          }

          $toolTransformationsPath = Join-Path (Resolve-Path ".").Path "ci/validation_tools/tool_json_adaptations.json"
          if (-not (Test-Path $toolTransformationsPath)) {
            throw "Tool adaptations config not found: $toolTransformationsPath"
          }
          $toolTransformations = Get-Content -Path $toolTransformationsPath -Raw | ConvertFrom-Json -AsHashtable

          if ($toolsToProcess.Count -eq 0) {
            $toolsToProcess = @(
              $toolTransformations.GetEnumerator() |
                Where-Object {
                  $_.Value -is [hashtable] -and
                  $_.Value.ContainsKey("updates") -and
                  $null -ne $_.Value.updates -and
                  $_.Value.updates.Count -gt 0
                } |
                ForEach-Object { [string]$_.Key } |
                Sort-Object
            )

            if ($toolsToProcess.Count -eq 0) {
              throw "No tool definitions with updates found in tool_json_adaptations.json"
            }

            Write-Host "No tools_to_process provided; defaulting to all tools from tool_json_adaptations.json."
          }

          function Convert-ToJsonPath {
            param([string]$PathValue)
            return ($PathValue -replace '\\', '/')
          }

          Write-Host "Tools configured for this run:"
          if ($toolsToProcess.Count -eq 0) {
            Write-Host " - none (all others will be skipped)"
          } else {
            foreach ($toolName in $toolsToProcess) {
              Write-Host " - $toolName"
            }
          }

          if ($toolsToProcess.Count -gt 0) {
            $missingToolDefinitions = @()
            $toolsWithoutUpdates = @()

            foreach ($toolName in $toolsToProcess) {
              if (-not $toolTransformations.ContainsKey($toolName)) {
                $missingToolDefinitions += $toolName
                continue
              }

              $toolDefinition = $toolTransformations[$toolName]
              if (-not $toolDefinition.ContainsKey("updates") -or $toolDefinition.updates.Count -eq 0) {
                $toolsWithoutUpdates += $toolName
              }
            }

            if ($missingToolDefinitions.Count -gt 0 -or $toolsWithoutUpdates.Count -gt 0) {
              if ($missingToolDefinitions.Count -gt 0) {
                Write-Host "::error::Missing tool adaptation definition(s) in tool_json_adaptations.json: $($missingToolDefinitions -join ', ')"
              }
              if ($toolsWithoutUpdates.Count -gt 0) {
                Write-Host "::error::Tool adaptation definition(s) without updates in tool_json_adaptations.json: $($toolsWithoutUpdates -join ', ')"
              }
              throw "Invalid tool adaptation configuration for requested tool(s)."
            }
          }

          function Resolve-ConfiguredValue {
            param(
              [hashtable]$Spec,
              [string]$WorkspaceDir
            )

            function Convert-ToPythonLiteral {
              param([object]$Value)

              if ($null -eq $Value) {
                return "None"
              }

              if ($Value -is [string]) {
                $escaped = $Value.Replace("'", "\\'")
                return "'$escaped'"
              }

              if ($Value -is [bool]) {
                if ($Value) {
                  return "True"
                }
                return "False"
              }

              if ($Value -is [System.Collections.IDictionary]) {
                $parts = @()
                foreach ($key in $Value.Keys) {
                  $parts += "$(Convert-ToPythonLiteral $key): $(Convert-ToPythonLiteral $Value[$key])"
                }
                return "{$($parts -join ', ')}"
              }

              if ($Value -is [System.Collections.IEnumerable] -and -not ($Value -is [string])) {
                $parts = @()
                foreach ($item in $Value) {
                  $parts += (Convert-ToPythonLiteral $item)
                }
                return "[$($parts -join ', ')]"
              }

              return [string]$Value
            }

            if ($null -eq $Spec -or -not $Spec.ContainsKey("kind")) {
              throw "Invalid value specification: missing kind"
            }

            $kind = [string]$Spec.kind
            $required = $true
            if ($Spec.ContainsKey("required")) {
              $required = [bool]$Spec.required
            }

            if ($kind -eq "literal") {
              return [string]$Spec.value
            }

            if ($kind -eq "workspacePath") {
              $relativePath = [string]$Spec.relativePath
              if ([string]::IsNullOrWhiteSpace($relativePath)) {
                throw "workspacePath specification requires relativePath"
              }

              $fullPath = Join-Path (Resolve-Path $WorkspaceDir).Path $relativePath
              $parentDir = Split-Path -Path $fullPath -Parent
              if (-not [string]::IsNullOrWhiteSpace($parentDir)) {
                New-Item -ItemType Directory -Path $parentDir -Force | Out-Null
              }

              return Convert-ToJsonPath -PathValue $fullPath
            }

            if ($kind -eq "workspaceFileContents") {
              $relativePath = [string]$Spec.relativePath
              if ([string]::IsNullOrWhiteSpace($relativePath)) {
                throw "workspaceFileContents specification requires relativePath"
              }

              $fullPath = Join-Path (Resolve-Path $WorkspaceDir).Path $relativePath
              if (-not (Test-Path $fullPath)) {
                if ($required) {
                  throw "workspaceFileContents target not found: $fullPath"
                }
                return $null
              }

              $content = Get-Content -Path $fullPath -Raw -ErrorAction Stop
              return [string]$content
            }

            if ($kind -eq "workspaceFileJson") {
              $relativePath = [string]$Spec.relativePath
              if ([string]::IsNullOrWhiteSpace($relativePath)) {
                throw "workspaceFileJson specification requires relativePath"
              }

              $fullPath = Join-Path (Resolve-Path $WorkspaceDir).Path $relativePath
              if (-not (Test-Path $fullPath)) {
                if ($required) {
                  throw "workspaceFileJson target not found: $fullPath"
                }
                return $null
              }

              $raw = Get-Content -Path $fullPath -Raw -ErrorAction Stop
              try {
                $obj = ConvertFrom-Json -InputObject $raw -ErrorAction Stop
                return $obj
              }
              catch {
                throw "workspaceFileJson could not parse JSON from: $fullPath"
              }
            }

            if ($kind -eq "workspaceFilePythonLiteral") {
              $relativePath = [string]$Spec.relativePath
              if ([string]::IsNullOrWhiteSpace($relativePath)) {
                throw "workspaceFilePythonLiteral specification requires relativePath"
              }

              $fullPath = Join-Path (Resolve-Path $WorkspaceDir).Path $relativePath
              if (-not (Test-Path $fullPath)) {
                if ($required) {
                  throw "workspaceFilePythonLiteral target not found: $fullPath"
                }
                return $null
              }

              $raw = Get-Content -Path $fullPath -Raw -ErrorAction Stop

              # function Convert-PythonLiteralToJson {
              #   param([string]$pyText)
              #   $s = $pyText
              #   $s = $s -replace "(?m)#.*$",""                     # remove line comments
              #   $s = $s -replace "\bNone\b","null"
              #   $s = $s -replace "\bTrue\b","true"
              #   $s = $s -replace "\bFalse\b","false"
              #   # Naive single->double quote swap
              #   $s = $s -replace "'","\""
              #   # Remove trailing commas before ] or } using .NET regex to avoid parser issues
              #   $trimPattern = ',\s*(\]|\})'
              #   $s = [regex]::Replace($s, $trimPattern, '$1')
              #   return $s
              # }

              # $jsonText = Convert-PythonLiteralToJson -pyText $raw
              # try {
              #   $obj = ConvertFrom-Json -InputObject $jsonText -ErrorAction Stop
              #   # Also write a .json copy into the validation workspace so other steps
              #   # can reference the converted JSON file directly if needed.
              #   try {
              #     $destRelative = if ($relativePath -match "\.txt$") { $relativePath -replace "\.txt$",".json" } else { "$relativePath.json" }
              #     $destFull = Join-Path (Resolve-Path $WorkspaceDir).Path $destRelative
              #     $destParent = Split-Path -Path $destFull -Parent
              #     if (-not (Test-Path $destParent)) { New-Item -ItemType Directory -Path $destParent -Force | Out-Null }
              #     $obj | ConvertTo-Json -Depth 40 | Set-Content -Path $destFull -Encoding UTF8
              #     Write-Host "Wrote converted JSON to: $destFull"
              #   } catch {
              #     Write-Host "Warning: failed to write converted JSON file: $($_.Exception.Message)"
              #   }
              #   return $obj
              # } catch {
              #   Write-Host "Warning: workspaceFilePythonLiteral could not parse converted JSON for: $fullPath; returning raw text"
              #   return [string]$raw
              # }
            }

            if ($kind -eq "privateDatasetPath") {
              $relativePath = [string]$Spec.relativePath
              if ([string]::IsNullOrWhiteSpace($relativePath)) {
                throw "privateDatasetPath specification requires relativePath"
              }

              $output = if ($Spec.ContainsKey("output")) { [string]$Spec.output } else { "path" }

              $fullPath = Join-Path (Resolve-Path "private-dataset").Path $relativePath
              if (-not (Test-Path $fullPath)) {
                if ($required) {
                  throw "privateDatasetPath target not found: $fullPath"
                }
                return $null
              }

              $resolvedPath = Convert-ToJsonPath -PathValue $fullPath
              if ($output -eq "list") {
                return ,@($resolvedPath)
              }
              if ($output -eq "pythonListSingleQuoted") {
                return "['$resolvedPath']"
              }

              return $resolvedPath
            }

            if ($kind -eq "findPath") {
              $roots = @()
              if ($Spec.ContainsKey("roots")) {
                $roots = @($Spec.roots | ForEach-Object { [string]$_ })
              }
              if ($roots.Count -eq 0) {
                throw "findPath specification requires at least one root"
              }

              $itemType = if ($Spec.ContainsKey("itemType")) { [string]$Spec.itemType } else { "Directory" }
              $matchRegex = [string]$Spec.matchRegex
              $pick = if ($Spec.ContainsKey("pick")) { [string]$Spec.pick } else { "first" }
              $output = if ($Spec.ContainsKey("output")) { [string]$Spec.output } else { "path" }

              $pathMatches = @()
              foreach ($root in $roots) {
                if (-not (Test-Path $root)) {
                  continue
                }

                if ($itemType -eq "File") {
                  $found = Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue
                }
                else {
                  $found = Get-ChildItem -Path $root -Recurse -Directory -ErrorAction SilentlyContinue
                }

                if (-not [string]::IsNullOrWhiteSpace($matchRegex)) {
                  $found = $found | Where-Object { $_.FullName -match $matchRegex }
                }

                $pathMatches += @($found)
              }

              $pathMatches = $pathMatches | Sort-Object FullName
              if ($pathMatches.Count -eq 0) {
                if ($required) {
                  throw "No path matched for findPath roots=[$($roots -join ',')] regex='$matchRegex'"
                }
                return $null
              }

              $selectedPaths = @()
              if ($pick -eq "all") {
                $selectedPaths = @($pathMatches | Select-Object -ExpandProperty FullName)
              }
              else {
                $selectedPaths = @($pathMatches[0].FullName)
              }

              $selectedPaths = @($selectedPaths | ForEach-Object { Convert-ToJsonPath -PathValue ([string]$_) })
              if ($output -eq "list") {
                return ,@($selectedPaths)
              }
              if ($output -eq "pythonDictByPath") {
                if (-not $Spec.ContainsKey("dictionaryMap") -or $null -eq $Spec.dictionaryMap) {
                  throw "findPath output=pythonDictByPath requires dictionaryMap"
                }

                $selectedPath = [string]$selectedPaths[0]
                $escapedPath = $selectedPath.Replace("'", "\\'")
                $pairs = @()
                foreach ($mapKey in $Spec.dictionaryMap.Keys) {
                  $mapValue = [string]$Spec.dictionaryMap[$mapKey]
                  $escapedKey = ([string]$mapKey).Replace("'", "\\'")
                  $escapedValue = $mapValue.Replace("'", "\\'")
                  $pairs += "'$escapedKey': '$escapedValue'"
                }

                return "{'$escapedPath': {$($pairs -join ', ')}}"
              }
              if ($output -eq "pythonListSingleQuoted") {
                $quoted = $selectedPaths | ForEach-Object { "'$_'" }
                return "[$($quoted -join ',')]"
              }

              return $selectedPaths[0]
            }

            if ($kind -eq "pythonDictFromFileMapping") {
              if (-not $Spec.ContainsKey("fileSpec")) {
                throw "pythonDictFromFileMapping specification requires fileSpec"
              }
              if (-not $Spec.ContainsKey("mapping")) {
                throw "pythonDictFromFileMapping specification requires mapping"
              }

              $resolvedFilePath = Resolve-ConfiguredValue -Spec $Spec.fileSpec -WorkspaceDir $WorkspaceDir
              if ($null -eq $resolvedFilePath -or [string]::IsNullOrWhiteSpace([string]$resolvedFilePath)) {
                if ($required) {
                  throw "pythonDictFromFileMapping could not resolve file path"
                }
                return $null
              }

              $fileMapping = @{}
              $fileMapping[[string]$resolvedFilePath] = $Spec.mapping
              return (Convert-ToPythonLiteral $fileMapping)
            }

            throw "Unsupported value specification kind: $kind"
          }

          function Format-ValueForLog {
            param([object]$Value)

            if ($null -eq $Value) {
              return "null"
            }

            if ($Value -is [string]) {
              return [string]$Value
            }

            if ($Value -is [System.Collections.IEnumerable]) {
              return (ConvertTo-Json -InputObject $Value -Depth 10 -Compress)
            }

            return [string]$Value
          }

          function Convert-ExtractedJson {
            param(
              [string]$SourcePath,
              [string]$DestinationPath,
              [string]$ToolName,
              [string[]]$ToolsToProcess
            )

            function Update-NodeInputsByIdentifier {
              param(
                [hashtable]$JsonObject,
                [string]$Identifier,
                [string]$InputName,
                [object]$InputValue
              )

              if (-not $JsonObject.ContainsKey("process_params") -or -not $JsonObject.process_params.ContainsKey("nodes")) {
                return $false
              }

              $updated = $false
              foreach ($node in $JsonObject.process_params.nodes) {
                if ($node.identifier -ne $Identifier) {
                  continue
                }

                if ($node.inputs.ContainsKey($InputName)) {

                  # Preserve array-ness: only wrap values if the existing JSON value is
                  # actually an array. Dictionaries (JSON objects) should remain objects.
                  $existingVal = $node.inputs[$InputName].value

                  $existingIsArray = $existingVal -is [System.Array]
                  $inputIsArray    = $InputValue -is [System.Array]

                  if ($existingIsArray -and -not $inputIsArray) {
                    $InputValue = @($InputValue)
                  }
                  elseif (-not $existingIsArray -and $inputIsArray -and $InputValue.Count -eq 1) {
                    $InputValue = $InputValue[0]
                  }

                  $node.inputs[$InputName].value = $InputValue
                  $updated = $true
                }
              }

              return $updated
            }

            $json = Get-Content -Path $SourcePath -Raw | ConvertFrom-Json -AsHashtable
            if (-not $json.ContainsKey("metadata")) {
              $json.metadata = @{}
            }

            # Use the JSON file basename as the stable identifier for step-by-step processing.
            $shouldTransform = $false
            if ($ToolsToProcess.Count -gt 0) {
              $shouldTransform = $ToolsToProcess -contains $ToolName
            }

            if (-not $shouldTransform) {
              return $false
            }

            $toolDefinition = @{}
            if ($toolTransformations.ContainsKey($ToolName)) {
              $toolDefinition = $toolTransformations[$ToolName]
            }

            $json.metadata.validationSource = "installed-package"
            $json.metadata.validationTarget = "validation-workspaces"
            $json.metadata.toolName = if ($toolDefinition.ContainsKey("targetToolName")) { [string]$toolDefinition.targetToolName } else { $ToolName }
            if ($toolDefinition.ContainsKey("processingMode") -and -not [string]::IsNullOrWhiteSpace([string]$toolDefinition.processingMode)) {
              $json.metadata.processingMode = [string]$toolDefinition.processingMode
            }
            elseif ($json.metadata.ContainsKey("processingMode")) {
              $json.metadata.Remove("processingMode")
            }

            if ($toolDefinition.ContainsKey("updates")) {
              foreach ($update in $toolDefinition.updates) {
                $identifier = [string]$update.identifier
                $inputName = [string]$update.inputName
                $required = $true
                if ($update.ContainsKey("required")) {
                  $required = [bool]$update.required
                }

                if ([string]::IsNullOrWhiteSpace($identifier)) {
                  throw "Invalid updates entry in ${ToolName}: missing identifier"
                }
                if ([string]::IsNullOrWhiteSpace($inputName)) {
                  throw "Invalid updates entry in ${ToolName}: missing inputName"
                }

                if (-not $update.ContainsKey("value")) {
                  throw "Invalid updates entry in ${ToolName}: missing value specification"
                }

                $resolvedInputValue = Resolve-ConfiguredValue -Spec $update.value -WorkspaceDir $workspaceDir
                Write-Host "$ToolName update '$identifier.$inputName': $(Format-ValueForLog -Value $resolvedInputValue)"

                $didUpdate = Update-NodeInputsByIdentifier -JsonObject $json -Identifier $identifier -InputName $inputName -InputValue $resolvedInputValue
                if (-not $didUpdate -and $required) {
                  throw "Unable to update node '$identifier' input '$inputName' in $SourcePath"
                }
              }
            }

            $destinationDir = Split-Path -Path $DestinationPath -Parent
            New-Item -ItemType Directory -Path $destinationDir -Force | Out-Null

            $json | ConvertTo-Json -Depth 20 | Set-Content -Path $DestinationPath -Encoding UTF8
            return $true
          }

          $sourceRoot = (Resolve-Path $sourceDir).Path
          Get-ChildItem -Path $sourceDir -Recurse -File -Filter "*.json" | ForEach-Object {
            $relativePath = $_.FullName.Substring($sourceRoot.Length).TrimStart('\', '/')
            $jsonFileName = [System.IO.Path]::GetFileNameWithoutExtension($_.Name)
            if ($jsonFileName -eq "CEAMSTools") {
              Write-Host "Catalog file kept for logging: $relativePath"
              return
            }

            $shouldTransform = Convert-ExtractedJson -SourcePath $_.FullName -DestinationPath (Join-Path $workspaceDir $relativePath) -ToolName $jsonFileName -ToolsToProcess $toolsToProcess

            if ($shouldTransform) {
              Write-Host "Adapted: $relativePath"
            } else {
              Write-Host "Skipped: $relativePath"
            }
          }

          Write-Host "Generated adaptive workspace JSON files:"
          Get-ChildItem -Path $workspaceDir -Recurse -File -Filter "*.json" |
            ForEach-Object { $_.FullName.Substring((Resolve-Path $workspaceDir).Path.Length).TrimStart('\', '/') } |
            Sort-Object |
            ForEach-Object { Write-Host " - $_" }

      - name: Adapt JSON paths for cross-platform validation
        shell: pwsh
        run: |
          Write-Host "Adapting JSON configuration file paths for Windows runner..."
          python ci/validation_tools/adapt_json_paths.py --workspace-root "${{ github.workspace }}"
          if ($LASTEXITCODE -ne 0) {
            throw "JSON path adaptation failed with exit code $LASTEXITCODE"
          }
          Write-Host "JSON paths successfully adapted."

      - name: Run adapted headless scenarios and print failure logs
        shell: pwsh
        run: |
          function Get-ToolVersionFromJson {
            param([string]$ScenarioPath)

            if (-not (Test-Path $ScenarioPath)) {
              return "unknown"
            }

            try {
              $scenarioJson = Get-Content -Path $ScenarioPath -Raw | ConvertFrom-Json
              if ($null -ne $scenarioJson.tool_params -and -not [string]::IsNullOrWhiteSpace([string]$scenarioJson.tool_params.tool_version)) {
                return [string]$scenarioJson.tool_params.tool_version
              }
            }
            catch {
              Write-Host "::warning::Unable to parse tool_version from $ScenarioPath"
            }

            return "unknown"
          }

          function Get-NormalizedLines {
            param([string]$Path)
            $raw = Get-Content -Path $Path -Raw
            $normalized = $raw -replace "`r`n", "`n"
            return $normalized -split "`n"
          }

          function Find-FirstFileByName {
            param(
              [string[]]$Roots,
              [string]$FileName
            )

            foreach ($root in $Roots) {
              if (-not (Test-Path $root)) {
                continue
              }

              $candidate = Get-ChildItem -Path $root -Recurse -File -Filter $FileName -ErrorAction SilentlyContinue |
                Sort-Object FullName |
                Select-Object -First 1

              if ($null -ne $candidate) {
                return $candidate.FullName
              }
            }

            return $null
          }

          $toolsToProcessInput = "${{ inputs.tools_to_process }}".Trim().Trim('"')
          $toolsToProcess = @()
          if (-not [string]::IsNullOrWhiteSpace($toolsToProcessInput)) {
            $toolsToProcess = $toolsToProcessInput -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          }

          if ($toolsToProcess.Count -eq 0) {
            $toolTransformationsPath = Join-Path (Resolve-Path ".").Path "ci/validation_tools/tool_json_adaptations.json"
            if (-not (Test-Path $toolTransformationsPath)) {
              throw "Tool adaptations config not found: $toolTransformationsPath"
            }

            $toolTransformations = Get-Content -Path $toolTransformationsPath -Raw | ConvertFrom-Json -AsHashtable
            $toolsToProcess = @(
              $toolTransformations.GetEnumerator() |
                Where-Object {
                  $_.Value -is [hashtable] -and
                  $_.Value.ContainsKey("updates") -and
                  $null -ne $_.Value.updates -and
                  $_.Value.updates.Count -gt 0
                } |
                ForEach-Object { [string]$_.Key } |
                Sort-Object
            )

            if ($toolsToProcess.Count -eq 0) {
              throw "No tool definitions with updates found in tool_json_adaptations.json"
            }

            Write-Host "No tools_to_process provided; defaulting to all tools from tool_json_adaptations.json: $($toolsToProcess -join ', ')"
          }

          if ([string]::IsNullOrWhiteSpace("$env:SNOOZ_INSTALLED_EXE") -or -not (Test-Path "$env:SNOOZ_INSTALLED_EXE")) {
            throw "Installed executable path is missing or invalid: '$env:SNOOZ_INSTALLED_EXE'"
          }

          $workspaceRoot = "validation-workspaces"
          if (-not (Test-Path $workspaceRoot)) {
            throw "Validation workspace directory not found: $workspaceRoot"
          }

          $scenariosToRun = @()
          foreach ($toolName in $toolsToProcess) {
            $scenarioPath = Get-ChildItem -Path $workspaceRoot -Recurse -File -Filter "$toolName.json" -ErrorAction SilentlyContinue |
              Sort-Object FullName |
              Select-Object -First 1
            if ($null -eq $scenarioPath) {
              throw "Could not find adapted $toolName.json under $workspaceRoot"
            }

            $scenariosToRun += [PSCustomObject]@{
              ToolName = $toolName
              ScenarioPath = $scenarioPath.FullName
            }
          }

          $logDir = Join-Path "target" "validation-logs"
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          $logDir = (Resolve-Path $logDir).Path
          $toolRunSummary = @()
          $failedScenarios = @()
          $succeededCount = 0
          $goldTag = "${{ inputs.gold_standard_tag }}".Trim().Trim('"')
          $toolValidationConfig = @{}
          $toolValidationConfigPath = Join-Path (Resolve-Path ".").Path "ci/validation_tools/tool_validations.json"
          if (Test-Path $toolValidationConfigPath) {
            $toolValidationConfig = Get-Content -Path $toolValidationConfigPath -Raw | ConvertFrom-Json -AsHashtable
          }

          foreach ($scenarioEntry in $scenariosToRun) {
            $toolName = $scenarioEntry.ToolName
            $scenarioPath = $scenarioEntry.ScenarioPath
            $toolVersion = Get-ToolVersionFromJson -ScenarioPath $scenarioPath
            $toolStatus = "fail"
            $comparisonStatus = "not-configured"
            $validatedFilesForTool = @()

            Write-Host "Using adapted scenario JSON for ${toolName}: $scenarioPath"
            # (no pre-created reports folder — outputs will be written in flat layout)

            $learnNsrr01Tsv = Get-ChildItem -Path "private-dataset" -Recurse -File -Filter "learn-nsrr01.tsv" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -ne $learnNsrr01Tsv) {
              Write-Host "Before ${toolName}: learn-nsrr01.tsv size = $($learnNsrr01Tsv.Length) bytes"
            } else {
              Write-Host "Before ${toolName}: learn-nsrr01.tsv not found under private-dataset"
            }

            Write-Host "Launching headless scenario: $env:SNOOZ_INSTALLED_EXE --f $scenarioPath"

            $executionLogPath = Join-Path $logDir ("{0}-headless-exec.log" -f $toolName.ToLowerInvariant())
            Set-Content -Path $executionLogPath -Value $null

            & "$env:SNOOZ_INSTALLED_EXE" --f "$scenarioPath" 2>&1 | Tee-Object -FilePath $executionLogPath
            $appStatus = $LASTEXITCODE

            $learnNsrr01Tsv = Get-ChildItem -Path "private-dataset" -Recurse -File -Filter "learn-nsrr01.tsv" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -ne $learnNsrr01Tsv) {
              Write-Host "After ${toolName}: learn-nsrr01.tsv size = $($learnNsrr01Tsv.Length) bytes"
            } else {
              Write-Host "After ${toolName}: learn-nsrr01.tsv not found under private-dataset"
            }

            # Diagnostic: list TSVs under validation-workspaces (only if single tool for readability)
            if ($toolsToProcess.Count -eq 1) {
              Write-Host "Diagnostic: TSV files under validation-workspaces (top 50)"
              if (Test-Path "validation-workspaces") {
                Get-ChildItem -Path validation-workspaces -Recurse -File -Filter "*.tsv" |
                  Sort-Object FullName |
                  Select-Object -First 50 -ExpandProperty FullName | ForEach-Object { Write-Host " - $_" }
              } else {
                Write-Host " - validation-workspaces directory not present"
              }
            }
            if ($null -eq $appStatus) {
              $appStatus = 0
            }

            if ($appStatus -ne 0) {
              $comparisonStatus = "fail"
              $scenarioDir = Split-Path $scenarioPath -Parent
              $snoozProcessLog = Get-ChildItem -Path $scenarioDir -Filter "*.log" -File -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
              if ($null -ne $snoozProcessLog) {
                Write-Host "Detected Snooz process log: $($snoozProcessLog.FullName)"
                Write-Host "--- Snooz process log (last 200 lines) ---"
                Get-Content -Path $snoozProcessLog.FullName -Tail 200 | ForEach-Object { Write-Host $_ }
              }
              else {
                Write-Host "::warning::No Snooz process log found next to adapted scenario JSON (pattern: $scenarioDir/*.log)"
              }

              Write-Host "Headless execution log file: $executionLogPath"
              Write-Host "--- Headless execution log (last 200 lines) ---"
              Get-Content -Path $executionLogPath -Tail 200 | ForEach-Object { Write-Host $_ }

              $failedScenarios += [PSCustomObject]@{
                ToolName = $toolName
                Status = $appStatus
                ExecutionLog = $executionLogPath
              }
              $toolRunSummary += [PSCustomObject]@{
                tool_name = $toolName
                tool_version = $toolVersion
                json_name = [System.IO.Path]::GetFileName($scenarioPath)
                run_status = $toolStatus
                comparison_status = $comparisonStatus
                validated_files = if ($validatedFilesForTool.Count -gt 0) { $validatedFilesForTool -join '; ' } else { 'none' }
              }
              Write-Host "::error::Headless execution failed for ${toolName} with status $appStatus. Continuing to next scenario."
              continue
            }

            # Even when the executable returned exit code 0, inspect logs for internal errors.
            $scenarioDir = Split-Path $scenarioPath -Parent
            $snoozProcessLog = Get-ChildItem -Path $scenarioDir -Filter "*.log" -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if ($null -ne $snoozProcessLog) {
              $processLogPath = $snoozProcessLog.FullName
            } else {
              $processLogPath = $null
            }

            $errorPatterns = @('process Interrupted','Traceback','Exception','AttributeError','Error:','Unhandled exception')
            $successPattern = 'process Total process time'
            $detectedError = $false
            $detectedLines = @()

            if ($processLogPath) {
              $procLogText = Get-Content -Raw -Path $processLogPath -ErrorAction SilentlyContinue
              foreach ($pat in $errorPatterns) {
                if ($procLogText -match $pat) {
                  $detectedError = $true
                  $detectedLines += "ProcessLog: matched '$pat'"
                }
              }
            }

            $execLogText = Get-Content -Raw -Path $executionLogPath -ErrorAction SilentlyContinue
            foreach ($pat in $errorPatterns) {
              if ($execLogText -match $pat) {
                $detectedError = $true
                $detectedLines += "ExecutionLog: matched '$pat'"
              }
            }

            if ($detectedError) {
              $comparisonStatus = 'fail'
              Write-Host "::error::Detected runtime error patterns for ${toolName}: $($detectedLines -join '; ')"
              if ($processLogPath) {
                Write-Host "--- Snooz process log (last 200 lines) ---"
                Get-Content -Path $processLogPath -Tail 200 | ForEach-Object { Write-Host $_ }
              }
              Write-Host "--- Headless execution log (last 200 lines) ---"
              Get-Content -Path $executionLogPath -Tail 200 | ForEach-Object { Write-Host $_ }

              $failedScenarios += [PSCustomObject]@{
                ToolName = $toolName
                Status = 'logged_error'
                ExecutionLog = $executionLogPath
              }
              $toolRunSummary += [PSCustomObject]@{
                tool_name = $toolName
                tool_version = $toolVersion
                json_name = [System.IO.Path]::GetFileName($scenarioPath)
                run_status = $toolStatus
                comparison_status = $comparisonStatus
                validated_files = if ($validatedFilesForTool.Count -gt 0) { $validatedFilesForTool -join '; ' } else { 'none' }
              }
              Write-Host "Marking ${toolName} as failed due to logged errors. Continuing to next scenario."
              continue
            }

            # Require explicit success marker in logs to consider run successful.
            $hasSuccess = $false
            if ($processLogPath) {
              if ($procLogText -match [regex]::Escape($successPattern)) { $hasSuccess = $true }
            }
            if (-not $hasSuccess) {
              if ($execLogText -match [regex]::Escape($successPattern)) { $hasSuccess = $true }
            }

            if (-not $hasSuccess) {
              $comparisonStatus = 'fail'
              Write-Host "::error::No success marker ('$successPattern') found in logs for ${toolName}. Treating as failure."
              if ($processLogPath) {
                Write-Host "--- Snooz process log (last 200 lines) ---"
                Get-Content -Path $processLogPath -Tail 200 | ForEach-Object { Write-Host $_ }
              }
              Write-Host "--- Headless execution log (last 200 lines) ---"
              Get-Content -Path $executionLogPath -Tail 200 | ForEach-Object { Write-Host $_ }

              $failedScenarios += [PSCustomObject]@{
                ToolName = $toolName
                Status = 'missing_success_marker'
                ExecutionLog = $executionLogPath
              }
              $toolRunSummary += [PSCustomObject]@{
                tool_name = $toolName
                tool_version = $toolVersion
                json_name = [System.IO.Path]::GetFileName($scenarioPath)
                run_status = $toolStatus
                comparison_status = $comparisonStatus
                validated_files = if ($validatedFilesForTool.Count -gt 0) { $validatedFilesForTool -join '; ' } else { 'none' }
              }
              Write-Host "Marking ${toolName} as failed due to missing success marker. Continuing to next scenario."
              continue
            }

            # Config-driven validation of output artifacts per tool.
            if ($toolValidationConfig.ContainsKey($toolName)) {
              if ([string]::IsNullOrWhiteSpace($goldTag)) {
                $comparisonStatus = "skipped-no-gold-standard-tag"
                Write-Host "No gold_standard_tag provided; skipping $toolName output comparison."
              }
              else {
                $compareScript = Join-Path (Resolve-Path ".").Path "ci/validation_tools/compare_outputs.py"
                if (-not (Test-Path $compareScript)) {
                  $comparisonStatus = "fail"
                  $failedScenarios += [PSCustomObject]@{
                    ToolName = $toolName
                    Status = "validation_failed"
                    ExecutionLog = $executionLogPath
                  }
                  $toolRunSummary += [PSCustomObject]@{
                    tool_name = $toolName
                    tool_version = $toolVersion
                    json_name = [System.IO.Path]::GetFileName($scenarioPath)
                    run_status = $toolStatus
                    comparison_status = $comparisonStatus
                    validated_files = if ($validatedFilesForTool.Count -gt 0) { $validatedFilesForTool -join '; ' } else { 'none' }
                  }
                  Write-Host "::error::Comparison script not found: $compareScript"
                  continue
                }

                $toolDefinition = $toolValidationConfig[$toolName]
                if (-not $toolDefinition.ContainsKey("comparisons") -or $toolDefinition.comparisons.Count -eq 0) {
                  $comparisonStatus = "skipped-no-comparisons-configured"
                  Write-Host "::warning::No comparisons configured for $toolName in tool_validations.json"
                }
                else {
                  $comparisonStatus = "running"
                  $toolValidationFailed = $false
                  foreach ($comparison in $toolDefinition.comparisons) {
                    $fileName = if ($comparison.ContainsKey("fileName") -and -not [string]::IsNullOrWhiteSpace([string]$comparison.fileName)) { [string]$comparison.fileName } else { "" }
                    $generatedFileName = if ($comparison.ContainsKey("generatedFileName") -and -not [string]::IsNullOrWhiteSpace([string]$comparison.generatedFileName)) { [string]$comparison.generatedFileName } else { $fileName }
                    $goldFileName = if ($comparison.ContainsKey("goldFileName") -and -not [string]::IsNullOrWhiteSpace([string]$comparison.goldFileName)) { [string]$comparison.goldFileName } else { $fileName }
                    $fileType = if ($comparison.ContainsKey("fileType") -and -not [string]::IsNullOrWhiteSpace([string]$comparison.fileType)) { [string]$comparison.fileType } else { "generic" }
                    $generatedRoots = @("validation-workspaces", "private-dataset")
                    if ($comparison.ContainsKey("generatedSearchRoots") -and $comparison.generatedSearchRoots.Count -gt 0) {
                      $generatedRoots = @($comparison.generatedSearchRoots | ForEach-Object { [string]$_ })
                    }

                    if ([string]::IsNullOrWhiteSpace($generatedFileName) -or [string]::IsNullOrWhiteSpace($goldFileName)) {
                      Write-Host "::error::$toolName invalid comparison entry. Define fileName (or both generatedFileName and goldFileName)."
                      $toolValidationFailed = $true
                      break
                    }

                    $generatedFile = Find-FirstFileByName -Roots $generatedRoots -FileName $generatedFileName
                    if ([string]::IsNullOrWhiteSpace($generatedFile)) {
                      Write-Host "::error::$toolName generated file not found: $generatedFileName"
                      Write-Host "Searched roots for ${toolName}:"
                      foreach ($root in $generatedRoots) {
                        Write-Host " - $root"
                        if (Test-Path $root) {
                          $tsvCandidates = Get-ChildItem -Path $root -Recurse -File -Filter "*.tsv" -ErrorAction SilentlyContinue |
                            Sort-Object FullName |
                            Select-Object -First 20
                          if ($tsvCandidates.Count -gt 0) {
                            Write-Host "   TSV candidates under ${root}:"
                            foreach ($candidate in $tsvCandidates) {
                              Write-Host "   - $($candidate.FullName)"
                            }
                          }
                          else {
                            Write-Host "   No TSV file found under $root"
                          }
                        }
                        else {
                          Write-Host "   Root does not exist"
                        }
                      }
                      $toolValidationFailed = $true
                      break
                    }

                    # Resolve generated file to a runner-native absolute path and verify it exists
                    try {
                      $generatedFileResolved = (Resolve-Path -Path $generatedFile -ErrorAction Stop).Path
                    } catch {
                      $generatedFileResolved = $generatedFile
                    }

                    if (-not (Test-Path $generatedFileResolved)) {
                      Write-Host "::error::$toolName generated file path not accessible to runner: $generatedFileResolved"
                      $toolValidationFailed = $true
                      break
                    }

                    # Search for gold standard in tool-specific folder only
                    $toolSpecificGoldDir = Join-Path "gold-standards" "extracted" $toolName
                    
                    if (-not (Test-Path $toolSpecificGoldDir)) {
                      Write-Host "::error::$toolName gold-standard directory not found: $toolSpecificGoldDir"
                      $toolValidationFailed = $true
                      break
                    }
                    
                    $goldReference = Get-ChildItem -Path $toolSpecificGoldDir -Recurse -File -Filter $goldFileName -ErrorAction SilentlyContinue |
                      Sort-Object FullName |
                      Select-Object -First 1
                    
                    if ($null -eq $goldReference) {
                      Write-Host "::error::$toolName gold-standard file not found in $toolSpecificGoldDir`: $goldFileName"
                      $toolValidationFailed = $true
                      break
                    }

                    Write-Host "Comparing $toolName output file: $generatedFileName"
                    Write-Host "Resolved generated path: $generatedFileResolved"
                    $compareArgs = @(
                      "$compareScript",
                      "--tool-name", "$toolName",
                      "--generated-file", "$generatedFileResolved",
                      "--reference-file", "$($goldReference.FullName)",
                      "--file-type", "$fileType",
                      "--max-diff-lines", "50"
                    )
                    if ($comparison.ContainsKey("precision") -and $null -ne $comparison.precision -and -not [string]::IsNullOrWhiteSpace([string]$comparison.precision)) {
                      $compareArgs += @("--precision", "$(($comparison.precision).ToString())")
                    }

                    & python @compareArgs
                    $compareStatus = $LASTEXITCODE
                    if ($compareStatus -ne 0) {
                      $comparisonStatus = "fail"
                      Write-Host "::error::$toolName output mismatch for $generatedFileName"
                      Write-Host "Generated file: $generatedFile"
                      Write-Host "Gold standard: $($goldReference.FullName)"
                      $toolValidationFailed = $true
                      break
                    }

                    if ($generatedFileName -ieq $goldFileName) {
                      $validatedFilesForTool += $generatedFileName
                    }
                    else {
                      $validatedFilesForTool += ("{0} (ref: {1})" -f $generatedFileName, $goldFileName)
                    }
                  }

                  if ($toolValidationFailed) {
                    $failedScenarios += [PSCustomObject]@{
                      ToolName = $toolName
                      Status = "validation_failed"
                      ExecutionLog = $executionLogPath
                    }
                    $toolRunSummary += [PSCustomObject]@{
                      tool_name = $toolName
                      tool_version = $toolVersion
                      run_status = $toolStatus
                      comparison_status = $comparisonStatus
                      validated_files = if ($validatedFilesForTool.Count -gt 0) { $validatedFilesForTool -join '; ' } else { 'none' }
                    }
                    continue
                  }

                  $comparisonStatus = "pass"
                  Write-Host "$toolName outputs match configured gold standards."
                }
              }
            }
            else {
              $comparisonStatus = "not-configured"
            }

            Write-Host "Headless execution succeeded for ${toolName}."
            Write-Host "=========================================="
            Write-Host ""
            $toolStatus = "pass"
            $toolRunSummary += [PSCustomObject]@{
              tool_name = $toolName
              tool_version = $toolVersion
              json_name = [System.IO.Path]::GetFileName($scenarioPath)
              run_status = $toolStatus
              comparison_status = $comparisonStatus
              validated_files = if ($validatedFilesForTool.Count -gt 0) { $validatedFilesForTool -join '; ' } else { 'none' }
            }
            $succeededCount++
          }

          $runSummaryTsvPath = Join-Path $logDir "tool-run-summary.tsv"
          $toolRunSummary |
            Select-Object tool_name, tool_version, json_name,
              @{Name='run_status';Expression={ if ($_.run_status -eq 'pass') { 'pass' } else { 'fail' }}},
              @{Name='comparison_status';Expression={ if ($_.comparison_status -eq 'pass') { 'pass' } else { $_.comparison_status }}},
              validated_files |
            Export-Csv -Path $runSummaryTsvPath -NoTypeInformation -Encoding UTF8 -Delimiter "`t"
          Write-Host "Tool run summary TSV written to: $runSummaryTsvPath"

          Write-Host "Headless execution summary: success=$succeededCount failed=$($failedScenarios.Count) total=$($scenariosToRun.Count)"
          if ($failedScenarios.Count -gt 0) {
            Write-Host "Failed scenarios:"
            foreach ($failure in $failedScenarios) {
              Write-Host " - $($failure.ToolName): status=$($failure.Status), log=$($failure.ExecutionLog)"
            }
            throw "$($failedScenarios.Count) headless scenario(s) failed. See summary above."
          }

      - name: Collect evaluated files by tool
        shell: pwsh
        if: always()
        run: |
          $validationsPath = Join-Path (Resolve-Path ".").Path "ci/validation_tools/tool_validations.json"
          if (-not (Test-Path $validationsPath)) {
            Write-Host "tool_validations.json not found; skipping file collection."
            exit 0
          }

          $validations = Get-Content -Path $validationsPath -Raw | ConvertFrom-Json -AsHashtable

          $toolsToProcessInput = "${{ inputs.tools_to_process }}".Trim().Trim('"')
          $toolsToProcess = @()
          if (-not [string]::IsNullOrWhiteSpace($toolsToProcessInput)) {
            $toolsToProcess = $toolsToProcessInput -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          }

          if ($toolsToProcess.Count -eq 0) {
            $toolTransformationsPath = Join-Path (Resolve-Path ".").Path "ci/validation_tools/tool_json_adaptations.json"
            if (Test-Path $toolTransformationsPath) {
              $toolTransformations = Get-Content -Path $toolTransformationsPath -Raw | ConvertFrom-Json -AsHashtable
              $toolsToProcess = @(
                $toolTransformations.GetEnumerator() |
                  Where-Object {
                    $_.Value -is [hashtable] -and
                    $_.Value.ContainsKey("updates") -and
                    $null -ne $_.Value.updates -and
                    $_.Value.updates.Count -gt 0
                  } |
                  ForEach-Object { [string]$_.Key } |
                  Sort-Object
              )
            }
          }

          if ($toolsToProcess.Count -eq 0) {
            Write-Host "No tools to process; skipping file collection."
            exit 0
          }

          $outputBaseDir = "validation-outputs"
          if (Test-Path $outputBaseDir) {
            Remove-Item -Path $outputBaseDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $outputBaseDir -Force | Out-Null

          foreach ($toolName in $toolsToProcess) {
            if (-not $validations.ContainsKey($toolName)) {
              Write-Host "Tool $toolName not found in tool_validations.json; skipping."
              continue
            }

            $toolConfig = $validations[$toolName]
            if (-not $toolConfig.ContainsKey("comparisons") -or $toolConfig.comparisons.Count -eq 0) {
              Write-Host "Tool $toolName has no comparisons defined; skipping."
              continue
            }

            $toolOutputDir = Join-Path $outputBaseDir $toolName
            New-Item -ItemType Directory -Path $toolOutputDir -Force | Out-Null

            foreach ($comparison in $toolConfig.comparisons) {
              $fileName = $comparison.fileName
              $generatedSearchRoots = $comparison.generatedSearchRoots
              if ($null -eq $generatedSearchRoots -or $generatedSearchRoots.Count -eq 0) {
                $generatedSearchRoots = @("validation-workspaces", "private-dataset")
              }

              # Find generated file in search roots
              $generatedFile = $null
              foreach ($root in $generatedSearchRoots) {
                $found = Get-ChildItem -Path $root -Recurse -File -Filter $fileName -ErrorAction SilentlyContinue |
                  Sort-Object FullName |
                  Select-Object -First 1
                if ($null -ne $found) {
                  $generatedFile = $found.FullName
                  break
                }
              }

              if ($null -ne $generatedFile) {
                $destGenFile = Join-Path $toolOutputDir ("generated_" + (Split-Path $generatedFile -Leaf))
                Copy-Item -Path $generatedFile -Destination $destGenFile -Force
                Write-Host "Copied generated: $generatedFile -> $destGenFile"
              } else {
                Write-Host "::warning::Generated file not found for ${toolName}: $fileName"
              }

              # Find and copy gold standard reference - search in tool-specific folder only
              $toolSpecificGoldDir = Join-Path "gold-standards" "extracted" $toolName
              $goldFile = $null
              
              if (Test-Path $toolSpecificGoldDir) {
                $goldFile = Get-ChildItem -Path $toolSpecificGoldDir -Recurse -File -Filter $fileName -ErrorAction SilentlyContinue |
                  Sort-Object FullName |
                  Select-Object -First 1
              }
              
              if ($null -eq $goldFile) {
                Write-Host "::error::Gold standard file not found for ${toolName}: $fileName in $toolSpecificGoldDir"
              } else {
                $destGoldFile = Join-Path $toolOutputDir ("reference_" + (Split-Path $goldFile -Leaf))
                Copy-Item -Path $goldFile.FullName -Destination $destGoldFile -Force
                Write-Host "Copied reference: $($goldFile.FullName) -> $destGoldFile"
              }
            }
          }

          Write-Host "Collected evaluated files in: $outputBaseDir"

      - name: Upload adapted JSON and validation logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-assets
          if-no-files-found: warn
          path: |
            validation-workspaces/**/*.json
            validation-workspaces/**/*.log
            target/validation-logs/**/*.log
            target/validation-logs/tool-run-summary.tsv
            validation-outputs/**/*
