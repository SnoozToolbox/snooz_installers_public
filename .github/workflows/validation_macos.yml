name: Validate installer (macOS)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture (x64 or arm64)
        required: true
        default: x64
      installer_repo:
        description: Installer release repository (owner/name)
        required: true
        default: SnoozToolbox/snooz-toolbox-ceams
      installer_tag:
        description: Installer release tag to validate
        required: false
        default: ""
      installer_asset_pattern:
        description: Installer asset name pattern
        required: true
        default: "Snooz*.dmg"
      package_version:
        description: "CEAMS package version to validate (ex: 7.4.0)"
        required: true
        default: "7.4.0"
      dataset_repo:
        description: Private dataset repository (owner/name)
        required: true
        default: SnoozToolbox/snooz-datasets-private
      dataset_tag:
        description: Dataset release tag
        required: true
        default: v1.0.0
      tools_to_process:
        description: "Comma-separated list of tool basenames to adapt in this run (example: AnalyzeEEGConnectivity,MyOtherTool). Leave empty to run all tools defined in ci/validation_tools/tool_json_adaptations.json"
        required: false
        default: ""
      gold_standard_repo:
        description: Gold-standard repository (owner/name)
        required: false
        default: SnoozToolbox/snooz-gold-standards
      gold_standard_tag:
        description: Gold-standard release tag (optional; enables output comparison)
        required: false
        default: v1.0.0

  workflow_call:
    inputs:
      arch:
        description: Architecture (x64 or arm64)
        required: true
        type: string
      installer_repo:
        description: Installer release repository (owner/name)
        required: true
        type: string
      installer_tag:
        description: Installer release tag to validate (if empty, auto-generated from arch)
        required: false
        type: string
        default: ""
      installer_asset_pattern:
        description: Installer asset name pattern
        required: true
        type: string
      package_version:
        description: "CEAMS package version to validate (ex: 7.4.0)"
        required: true
        type: string
      dataset_repo:
        description: Private dataset repository (owner/name)
        required: true
        type: string
      dataset_tag:
        description: Dataset release tag
        required: true
        type: string
      tools_to_process:
        description: "Comma-separated list of tool basenames to adapt in this run (example: AnalyzeEEGConnectivity,MyOtherTool). Leave empty to run all tools defined in ci/validation_tools/tool_json_adaptations.json"
        required: false
        type: string
        default: ""
      gold_standard_repo:
        description: Gold-standard repository (owner/name)
        required: false
        type: string
        default: SnoozToolbox/snooz-gold-standards
      gold_standard_tag:
        description: Gold-standard release tag (optional; enables output comparison)
        required: false
        type: string
        default: v1.0.0

jobs:
  validate_macos:
    runs-on: macos-latest
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Download dataset release assets (private)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_VALIDATION }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing secret GH_PAT_VALIDATION"
            exit 1
          fi
          mkdir -p private-dataset
          gh release download "${{ inputs.dataset_tag }}" \
            --repo "${{ inputs.dataset_repo }}" \
            --dir private-dataset

      - name: Download gold standards release assets (optional)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_VALIDATION }}
        run: |
          GOLD_TAG="${{ inputs.gold_standard_tag }}"
          if [ -z "$GOLD_TAG" ]; then
            echo "No gold_standard_tag provided; skipping gold standards download."
            exit 0
          fi

          # If no explicit tools_to_process was provided, derive the list from tool_json_adaptations.json
          tools_input="${{ inputs.tools_to_process }}"
          if [ -z "$tools_input" ]; then
            toolTransformationsPath="ci/validation_tools/tool_json_adaptations.json"
            if [ ! -f "$toolTransformationsPath" ]; then
              echo "Tool adaptations config not found: $toolTransformationsPath"
              exit 1
            fi
            toolsToProcess=$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); print(",".join(sorted([k for k,v in data.items() if isinstance(v,dict) and v.get("updates")])))' "$toolTransformationsPath")

            if [ -z "$toolsToProcess" ]; then
              echo "No tool definitions with updates found in $toolTransformationsPath"
              exit 1
            fi

            echo "No tools_to_process provided; defaulting to all tools from tool_json_adaptations.json: $toolsToProcess"
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "Missing secret GH_PAT_VALIDATION"
            exit 1
          fi
          mkdir -p gold-standards
          gh release download "$GOLD_TAG" \
            --repo "${{ inputs.gold_standard_repo }}" \
            --dir gold-standards

      - name: Extract gold standards assets for requested tools (optional)
        shell: bash
        run: |
          GOLD_TAG="${{ inputs.gold_standard_tag }}"
          if [ -z "$GOLD_TAG" ]; then
            echo "No gold_standard_tag provided; skipping gold standards extraction."
            exit 0
          fi

          if [ ! -d "gold-standards" ]; then
            echo "Gold standards directory not found."
            exit 0
          fi

          mkdir -p gold-standards/extracted
          for zip_file in gold-standards/*.zip; do
            if [ -f "$zip_file" ]; then
              tool_name=$(basename "$zip_file" .zip)
              mkdir -p "gold-standards/extracted/$tool_name"
              unzip -o "$zip_file" -d "gold-standards/extracted/$tool_name"
              echo "Extracted: $zip_file"
            fi
          done

          echo "Gold-standard extracted files:"
          find gold-standards/extracted -type f | sort

      - name: Extract private dataset archives and list folders
        shell: bash
        run: |
          for zip_file in $(find private-dataset -name "*.zip" -type f); do
            dir=$(dirname "$zip_file")
            echo "Extracting archive: $zip_file"
            unzip -o "$zip_file" -d "$dir"
          done

          echo "Folders under private-dataset after extraction:"
          find private-dataset -type d | sort

      - name: Download macOS installer release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing secret GH_PAT"
            exit 1
          fi
          
          # Build installer tag if not provided
          INSTALLER_TAG="${{ inputs.installer_tag }}"
          if [ -z "$INSTALLER_TAG" ]; then
            ARCH="${{ inputs.arch }}"
            if [ "$ARCH" = "arm64" ]; then
              INSTALLER_TAG="v1.0.1-rc2-macOS-ARM64"
            elif [ "$ARCH" = "x64" ]; then
              INSTALLER_TAG="v1.0.1-rc2-macOS-x64"
            else
              echo "Invalid architecture: $ARCH (expected 'arm64' or 'x64')"
              exit 1
            fi
            echo "Auto-generated installer tag for $ARCH: $INSTALLER_TAG"
          fi
          
          mkdir -p installer
          gh release download "$INSTALLER_TAG" \
            --repo "${{ inputs.installer_repo }}" \
            --pattern "${{ inputs.installer_asset_pattern }}" \
            --dir installer

      - name: Show downloaded files
        shell: bash
        run: |
          echo "Private dataset release files:"
          find private-dataset -type f 2>/dev/null || true
          echo ""
          echo "Installer files:"
          find installer -type f 2>/dev/null || true

      - name: Install Snooz and extract JSON files
        shell: bash
        run: |
          INSTALLER=$(find installer -name "*.dmg" | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "No installer DMG found"
            exit 1
          fi

          INSTALL_DIR="/tmp/snooz_ci_install"
          rm -rf "$INSTALL_DIR"
          mkdir -p "$INSTALL_DIR"

          echo "Installing: $INSTALLER"
          hdiutil attach "$INSTALLER"
          
          # Find the mounted volume containing Snooz.app (volume name may vary)
          # Wait a moment for the volume to be fully mounted
          sleep 2
          
          MOUNTED_VOLUME=$(ls -d /Volumes/*nooz* 2>/dev/null | head -1)
          if [ -z "$MOUNTED_VOLUME" ]; then
            echo "No mounted volume containing 'Snooz' found"
            echo "Available volumes:"
            ls -la /Volumes
            exit 1
          fi
          
          echo "Found mounted volume: $MOUNTED_VOLUME"
          
          # Look for Snooz.app in the volume
          APP_PATH=$(find "$MOUNTED_VOLUME" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Snooz.app not found in $MOUNTED_VOLUME"
            echo "Contents of $MOUNTED_VOLUME:"
            ls -la "$MOUNTED_VOLUME"
            hdiutil detach "$MOUNTED_VOLUME" 2>/dev/null || true
            exit 1
          fi

          echo "Found app bundle: $APP_PATH"
          
          # Get the app name (it might not be exactly "Snooz.app")
          APP_NAME=$(basename "$APP_PATH")
          MACOS_DIR="$APP_PATH/Contents/MacOS"
          
          # The executable name is the same as the app name (minus .app)
          EXECUTABLE_NAME="${APP_NAME%.app}"
          INSTALLED_EXE="$MACOS_DIR/$EXECUTABLE_NAME"
          
          if [ ! -f "$INSTALLED_EXE" ]; then
            echo "Executable not found at expected location: $INSTALLED_EXE"
            exit 1
          fi
          
          if [ ! -x "$INSTALLED_EXE" ]; then
            echo "File is not executable: $INSTALLED_EXE"
            exit 1
          fi
          
          echo "Found executable: $INSTALLED_EXE"
          echo "Using app directly from mounted volume to preserve code signatures"
          
          # DO NOT detach the volume yet - we need it for execution and JSON extraction
          # Create INSTALL_DIR for JSON files extraction
          mkdir -p "$INSTALL_DIR"

          echo "SNOOZ_INSTALLED_EXE=$INSTALLED_EXE" >> "$GITHUB_ENV"

          # Extract JSON files from the mounted app
          VERSION_UNDERSCORE="${{ inputs.package_version }}"
          VERSION_UNDERSCORE="${VERSION_UNDERSCORE//./_}"
          
          CEAMS_TOOLS_DIR=$(find "$APP_PATH" -type d -name "CEAMSTools_$VERSION_UNDERSCORE" | head -1)
          if [ -z "$CEAMS_TOOLS_DIR" ]; then
            echo "CEAMSTools directory not found for version $VERSION_UNDERSCORE"
            exit 1
          fi

          mkdir -p validation-json
          find "$CEAMS_TOOLS_DIR" -name "*.json" -exec cp {} validation-json/ \;
          
          echo "Extracted JSON files:"
          find validation-json -type f -name "*.json" | sort

      - name: Adapt extracted JSON files for validation workspaces
        shell: bash
        run: |
          mkdir -p validation-workspaces
          
          python3 ci/validation_tools/adapt_scenario_json.py \
            --source-dir validation-json \
            --workspace-dir validation-workspaces \
            --adaptations-file ci/validation_tools/tool_json_adaptations.json \
            --private-dataset-dir private-dataset \
            --tools "${{ inputs.tools_to_process }}"
          
          if [ $? -ne 0 ]; then
            echo "::error::Scenario JSON adaptation failed"
            exit 1
          fi

      - name: Adapt JSON paths for cross-platform validation
        shell: bash
        run: |
          echo "Adapting JSON configuration file paths for macOS runner..."
          python3 ci/validation_tools/adapt_json_paths.py --workspace-root "${{ github.workspace }}"
          if [ $? -ne 0 ]; then
            echo "::error::JSON path adaptation failed"
            exit 1
          fi
          echo "JSON paths successfully adapted."

      - name: Run adapted headless scenarios and print failure logs
        shell: bash
        run: |
          mkdir -p target/validation-logs
          
          SNOOZ_EXE="${SNOOZ_INSTALLED_EXE}"
          if [ ! -f "$SNOOZ_EXE" ]; then
            echo "Snooz executable not found: $SNOOZ_EXE"
            exit 1
          fi

          # Extract list of actual tools from tool_json_adaptations.json
          TOOLS=$(python3 -c 'import json,sys; data=json.load(open("ci/validation_tools/tool_json_adaptations.json")); print(" ".join(sorted([k for k,v in data.items() if isinstance(v,dict) and v.get("updates")])))' 2>/dev/null)
          
          if [ -z "$TOOLS" ]; then
            echo "Warning: Could not extract tool list from tool_json_adaptations.json"
            TOOLS=$(ls validation-workspaces/*.json | xargs -n1 basename -s .json | grep -v -E '^(CEAMSTools|tool_|adaptations)' | sort)
          fi
          
          echo "Running scenarios for tools: $TOOLS"
          echo ""
          
          run_status_tsv="target/validation-logs/run-status.tsv"
          : > "$run_status_tsv"
          
          for TOOL_NAME in $TOOLS; do
            scenario="validation-workspaces/${TOOL_NAME}.json"
            
            if [ ! -f "$scenario" ]; then
              echo "Warning: Scenario not found: $scenario"
              continue
            fi
            
            echo "Running scenario: $TOOL_NAME"
            exec_log="target/validation-logs/${TOOL_NAME}-exec.log"
            
            # Run executable and capture exit code properly (don't use pipe with tee)
            "$SNOOZ_EXE" --f "$scenario" > "$exec_log" 2>&1
            app_status=$?
            
            # Also display output to console
            cat "$exec_log"
            
            # Check for errors in process log (generated by Snooz app)
            scenario_dir=$(dirname "$scenario")
            process_log=$(ls -t "$scenario_dir"/*.log 2>/dev/null | head -1)
            
            error_patterns=("process Interrupted" "Traceback" "Exception" "AttributeError" "Error:" "Unhandled exception")
            detected_error=false
            
            # Check process log for errors
            if [ -n "$process_log" ] && [ -f "$process_log" ]; then
              for pattern in "${error_patterns[@]}"; do
                if grep -q "$pattern" "$process_log" 2>/dev/null; then
                  detected_error=true
                  echo "::error::Detected runtime error in process log: matched '$pattern'"
                  break
                fi
              done
            fi
            
            # Check execution log for errors
            if [ "$detected_error" = false ]; then
              for pattern in "${error_patterns[@]}"; do
                if grep -q "$pattern" "$exec_log" 2>/dev/null; then
                  detected_error=true
                  echo "::error::Detected runtime error in execution log: matched '$pattern'"
                  break
                fi
              done
            fi
            
            # If errors detected, show logs and continue
            if [ "$detected_error" = true ]; then
              if [ -n "$process_log" ] && [ -f "$process_log" ]; then
                echo "--- Snooz process log (last 200 lines) ---"
                tail -200 "$process_log"
              fi
              echo "--- Headless execution log (last 200 lines) ---"
              tail -200 "$exec_log"
              echo "::error::Headless execution failed for $TOOL_NAME with runtime errors. Continuing to next scenario."
              printf '%s\tfail\n' "$TOOL_NAME" >> "$run_status_tsv"
            elif [ $app_status -ne 0 ]; then
              echo "::error::Headless execution failed for $TOOL_NAME with exit code $app_status"
              if [ -n "$process_log" ] && [ -f "$process_log" ]; then
                echo "--- Snooz process log (last 200 lines) ---"
                tail -200 "$process_log"
              fi
              echo "--- Headless execution log (last 200 lines) ---"
              tail -200 "$exec_log"
              printf '%s\tfail\n' "$TOOL_NAME" >> "$run_status_tsv"
            else
              echo "Headless execution succeeded for $TOOL_NAME."
              echo "=========================================="
              echo ""
              printf '%s\tpass\n' "$TOOL_NAME" >> "$run_status_tsv"
            fi
          done
          
          # Convert run-status.tsv to run-status.json for the comparison script
          python3 ci/validation_tools/build_run_status_json.py \
            --input target/validation-logs/run-status.tsv \
            --output target/validation-logs/run-status.json \
            --exec-log-dir target/validation-logs

      - name: Compare outputs against gold standards and write summary
        shell: bash
        if: always()
        run: |
          python3 ci/validation_tools/compare_and_summarize.py \
            --run-status-file target/validation-logs/run-status.json \
            --tool-validations-file ci/validation_tools/tool_validations.json \
            --gold-standards-dir gold-standards/extracted \
            --gold-standard-tag "${{ inputs.gold_standard_tag }}" \
            --compare-script ci/validation_tools/compare_outputs.py \
            --workspace-dir validation-workspaces \
            --output-summary-tsv tool-run-summary.tsv \
            --output-dir validation-outputs

      - name: Detach mounted DMG volume
        shell: bash
        if: always()
        run: |
          # Detach any mounted volumes containing "Snooz"
          for volume in $(ls -d /Volumes/*nooz* 2>/dev/null); do
            echo "Detaching: $volume"
            hdiutil detach "$volume" 2>/dev/null || true
          done
          echo "DMG volumes detached"

      - name: Upload adapted JSON and validation logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ inputs.arch }}-validation-assets
          if-no-files-found: warn
          path: |
            validation-workspaces/**/*.json
            validation-workspaces/**/*.log
            tool-run-summary.tsv
            validation-outputs/**/*
